<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Alert | Federal Custody Guide</title><style>body{font:16px/1.5 system-ui;background:#f8fafc;color:#0f172a}.c{max-width:620px;margin:60px auto;background:white;padding:28px;border:1px solid #e2e8f0;border-radius:16px}button{padding:12px 18px;border:0;border-radius:10px;background:#991b1b;color:white;font-weight:700}#m{margin-top:16px}</style></head><body><main class="c"><h1>Manage Alert / Administrar Alerta</h1><p>Use this page to stop this alert and delete its tracking record. / Use esta página para cancelar esta alerta y eliminar su registro.</p><button id="delete">Stop & Delete / Cancelar y Eliminar</button><p id="m" role="status"></p><p><a href="/privacy.html">Privacy / Privacidad</a></p></main><script>document.getElementById("delete").onclick=async()=>{const m=document.getElementById("m"),token=new URLSearchParams(location.search).get("token");if(!token){m.textContent="Invalid management link / Enlace inválido";return}if(!confirm("Stop this alert and delete its tracking record? / ¿Cancelar y eliminar el registro?"))return;m.textContent="Processing…";try{const r=await fetch("/api/alerts/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({manage_token:token})});const j=await r.json();m.textContent=r.ok?(j.message||"Completed / Completado"):(j.error||"Unavailable / No disponible")}catch{m.textContent="Unavailable / No disponible"}}</script></body></html>
