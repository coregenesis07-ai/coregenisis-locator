name: Deploy Coregenisis V2 Cloudflare Preview

on:
  push:
    branches: [coregenisis-v2]
    paths:
      - ".github/workflows/cloudflare-preview.yml"
      - "cloudflare-preview-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COREGENISIS_ADMIN_TOKEN: ${{ secrets.COREGENISIS_ADMIN_TOKEN }}

    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          ref: coregenisis-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install

      - name: Validate and verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

          # Remove accidental line breaks/outer whitespace introduced by mobile copy/paste.
          CLEAN_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CLEAN_TOKEN" || (echo "Cloudflare API token is empty after normalization" && exit 1)
          echo "::add-mask::$CLEAN_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLEAN_TOKEN" >> "$GITHUB_ENV"

          case "$CLEAN_TOKEN" in
            cfat_*) echo "Token format: Cloudflare account-owned token" ;;
            *) echo "Token format warning: newly created account-owned tokens normally begin with cfat_" ;;
          esac

          VERIFY_JSON="$(curl -sS -H "Authorization: Bearer $CLEAN_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          VERIFY_SUCCESS="$(printf '%s' "$VERIFY_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j.success===true&&j.result?.status==="active"?"yes":"no")}catch{process.stdout.write("no")}})')"
          if [ "$VERIFY_SUCCESS" != "yes" ]; then
            echo "Cloudflare rejected the Account API token during the official token verification check."
            printf '%s' "$VERIFY_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);for(const e of (j.errors||[])) console.log("Cloudflare error "+e.code+": "+e.message)}catch{console.log("Cloudflare verification returned an unreadable response")}})'
            exit 1
          fi
          echo "Cloudflare Account API token verified as active."

      - name: Find or create isolated preview D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          NAME="coregenisis-v2-preview-db"
          LIST_JSON="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$NAME&per_page=100")"

          LIST_OK="$(printf '%s' "$LIST_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j.success===true?"yes":"no")}catch{process.stdout.write("no")}})')"
          if [ "$LIST_OK" != "yes" ]; then
            echo "Direct Cloudflare D1 list request failed."
            printf '%s' "$LIST_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);for(const e of (j.errors||[])) console.log("Cloudflare error "+e.code+": "+e.message)}catch{console.log("Unreadable Cloudflare response")}})'
            exit 1
          fi

          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              const rows=Array.isArray(j.result)?j.result:[];
              const item=rows.find(x=>x.name==="coregenisis-v2-preview-db");
              if(item) process.stdout.write(item.uuid || item.id || "");
            })
          ')"

          if [ -z "$DB_ID" ]; then
            echo "Creating isolated preview D1 database"
            CREATE_JSON="$(curl -sS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"               --data '{"name":"coregenisis-v2-preview-db"}')"
            CREATE_OK="$(printf '%s' "$CREATE_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j.success===true?"yes":"no")}catch{process.stdout.write("no")}})')"
            if [ "$CREATE_OK" != "yes" ]; then
              echo "Direct Cloudflare D1 create request failed."
              printf '%s' "$CREATE_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);for(const e of (j.errors||[])) console.log("Cloudflare error "+e.code+": "+e.message)}catch{console.log("Unreadable Cloudflare response")}})'
              exit 1
            fi
            DB_ID="$(printf '%s' "$CREATE_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.result?.uuid||j.result?.id||"")})')"
          fi

          test -n "$DB_ID" || (echo "Could not determine preview D1 database ID" && exit 1)
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Preview D1 database located successfully."

      - name: Generate preview Wrangler config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs=require("fs");
          const cfg={
            "$schema":"./node_modules/wrangler/config-schema.json",
            name:"coregenisis-v2-preview",
            main:"./worker.js",
            compatibility_date:"2026-09-25",
            workers_dev:true,
            assets:{
              directory:"./public",
              binding:"ASSETS",
              not_found_handling:"single-page-application",
              run_worker_first:true
            },
            d1_databases:[{
              binding:"DB",
              database_name:"coregenisis-v2-preview-db",
              database_id:process.env.DB_ID
            }],
            vars:{
              PREVIEW_MODE:"1"
            },
            triggers:{
              crons:["0 10 * * *","30 10 * * 0"]
            }
          };
          fs.writeFileSync("wrangler.preview.ci.jsonc",JSON.stringify(cfg,null,2)+"\n");
          NODE

      - name: Initialize preview D1 schema
        run: npx wrangler d1 execute coregenisis-v2-preview-db --remote --yes --file schema.sql --config wrangler.preview.ci.jsonc

      - name: Configure optional admin refresh secret
        if: ${{ env.COREGENISIS_ADMIN_TOKEN != '' }}
        run: printf '%s' "$COREGENISIS_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config wrangler.preview.ci.jsonc

      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --config wrangler.preview.ci.jsonc

      - name: Next step
        run: |
          echo "Cloudflare preview deployment completed."
          echo "Open the Workers & Pages dashboard to copy the coregenisis-v2-preview workers.dev URL."
          echo "Then run: BASE_URL=https://<preview-url> npm run smoke"
