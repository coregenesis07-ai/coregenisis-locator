name: Deploy Coregenisis V2 Cloudflare Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COREGENISIS_ADMIN_TOKEN: ${{ secrets.COREGENISIS_ADMIN_TOKEN }}

    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          ref: coregenisis-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install

      - name: Validate Cloudflare credentials are present
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Find or create isolated preview D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          NAME="coregenisis-v2-preview-db"
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e '
            const fs=require("fs");
            const rows=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));
            const item=rows.find(x=>x.name==="coregenisis-v2-preview-db");
            if(item) process.stdout.write(item.uuid || item.id || "");
          ')
          if [ -z "$DB_ID" ]; then
            echo "Creating $NAME"
            npx wrangler d1 create "$NAME"
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID=$(node -e '
              const fs=require("fs");
              const rows=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));
              const item=rows.find(x=>x.name==="coregenisis-v2-preview-db");
              if(!item) process.exit(2);
              process.stdout.write(item.uuid || item.id || "");
            ')
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate preview Wrangler config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs=require("fs");
          const cfg={
            "$schema":"./node_modules/wrangler/config-schema.json",
            name:"coregenisis-v2-preview",
            main:"./worker.js",
            compatibility_date:"2026-09-25",
            workers_dev:true,
            assets:{
              directory:"./public",
              binding:"ASSETS",
              not_found_handling:"single-page-application",
              run_worker_first:true
            },
            d1_databases:[{
              binding:"DB",
              database_name:"coregenisis-v2-preview-db",
              database_id:process.env.DB_ID
            }],
            vars:{
              PREVIEW_MODE:"1"
            },
            triggers:{
              crons:["0 10 * * *","30 10 * * 0"]
            }
          };
          fs.writeFileSync("wrangler.preview.ci.jsonc",JSON.stringify(cfg,null,2)+"\n");
          NODE

      - name: Initialize preview D1 schema
        run: npx wrangler d1 execute coregenisis-v2-preview-db --remote --yes --file schema.sql --config wrangler.preview.ci.jsonc

      - name: Configure optional admin refresh secret
        if: ${{ env.COREGENISIS_ADMIN_TOKEN != '' }}
        run: printf '%s' "$COREGENISIS_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config wrangler.preview.ci.jsonc

      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --config wrangler.preview.ci.jsonc

      - name: Next step
        run: |
          echo "Cloudflare preview deployment completed."
          echo "Open the Workers & Pages dashboard to copy the coregenisis-v2-preview workers.dev URL."
          echo "Then run: BASE_URL=https://<preview-url> npm run smoke"
