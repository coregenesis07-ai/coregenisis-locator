name: SCA estimator regression tests
on:
  pull_request:
    paths:
      - 'public/app.js'
      - 'tests/sca-estimator.test.cjs'
      - '.github/workflows/sca-estimator-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app.js
      - run: node --test tests/sca-estimator.test.cjs
