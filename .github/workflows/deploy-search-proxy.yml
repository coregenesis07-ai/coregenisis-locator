name: Deploy Federal Custody Guide Search Proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          ref: coregenisis-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install

      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          CLEAN_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "::add-mask::$CLEAN_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLEAN_TOKEN" >> "$GITHUB_ENV"

      - name: Generate Wrangler config
        run: |
          cat > wrangler.search-proxy.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "federalcustodyguide-search",
            "main": "./search-proxy-worker.js",
            "compatibility_date": "2026-09-26",
            "workers_dev": true
          }
          EOF

      - name: Deploy search proxy
        run: npx wrangler deploy --config wrangler.search-proxy.jsonc
