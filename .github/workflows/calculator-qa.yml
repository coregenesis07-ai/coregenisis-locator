name: FSA calculator static QA
on:
  pull_request:
    paths:
      - 'public/first-step-act-calculator/**'
      - '.github/workflows/calculator-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculator-static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package draft calculator for isolated preview
        run: |
          test -f public/first-step-act-calculator/index.html
          test -f public/first-step-act-calculator/calculator.js
          test -f public/first-step-act-calculator/calculator-lang.js
      - name: Upload draft calculator preview files
        uses: actions/upload-artifact@v4
        with:
          name: fsa-calculator-pr-preview
          path: public/first-step-act-calculator/
          if-no-files-found: error
          retention-days: 7
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save --prefix /tmp/fsa-browser-qa playwright@1.56.1
          /tmp/fsa-browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser smoke test draft calculator EN/ES
        run: |
          NODE_PATH=/tmp/fsa-browser-qa/node_modules node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('file://'+process.cwd()+'/public/first-step-act-calculator/index.html');
              await page.waitForLoadState('load');
              assert(await page.locator('#calcLangEs').count(), 'Spanish toggle missing');
              await page.locator('#calcLangEs').click();
              assert.equal(await page.locator('html').getAttribute('lang'),'es');
              await page.locator('#calcLangEn').click();
              assert.equal(await page.locator('html').getAttribute('lang'),'en');
              assert.deepEqual(errors,[],'Browser JavaScript errors: '+errors.join('; '));
              console.log('Chromium mobile-viewport EN/ES smoke test passed');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Check calculator JavaScript syntax
        run: |
          node --check public/first-step-act-calculator/calculator.js
          node --check public/first-step-act-calculator/calculator-lang.js
      - name: Exercise translation on changing text nodes
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const source=fs.readFileSync('public/first-step-act-calculator/calculator-lang.js','utf8');
          let observer;
          const handlers={};
          const node={nodeType:3,nodeValue:'Start date entered: Sep 3, 2025'};
          const store={cg_lang:'es'};
          const buttons={
            '#calcLangEn':{addEventListener:(type,fn)=>handlers.en=fn,classList:{toggle(){}}},
            '#calcLangEs':{addEventListener:(type,fn)=>handlers.es=fn,classList:{toggle(){}}}
          };
          const doc={
            body:{},documentElement:{lang:'en'},
            querySelector:selector=>buttons[selector]||null,
            createTreeWalker:()=>{let used=false;return {nextNode:()=>used?null:(used=true,node)}}
          };
          const ctx={
            localStorage:{getItem:k=>store[k],setItem:(k,v)=>store[k]=v},
            document:doc,NodeFilter:{SHOW_TEXT:4},
            MutationObserver:class{constructor(fn){observer=fn}observe(){}},
            window:{},WeakMap,Map
          };
          vm.runInNewContext(source,ctx);
          observer([{type:'childList',addedNodes:[node]}]);
          assert.equal(node.nodeValue,'Fecha de inicio ingresada: Sep 3, 2025');
          node.nodeValue='Start date entered: Oct 4, 2025';
          observer([{type:'characterData',target:node}]);
          assert.equal(node.nodeValue,'Fecha de inicio ingresada: Oct 4, 2025');
          observer([{type:'characterData',target:node}]);
          assert.equal(node.nodeValue,'Fecha de inicio ingresada: Oct 4, 2025');
          handlers.en();
          assert.equal(node.nodeValue,'Start date entered: Oct 4, 2025');
          handlers.es();
          assert.equal(node.nodeValue,'Fecha de inicio ingresada: Oct 4, 2025');
          assert.equal(doc.documentElement.lang,'es');
          console.log('Dynamic text-node translation regression passed');
          NODE
      - name: Check bilingual repair wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const base='public/first-step-act-calculator/';
          const html=fs.readFileSync(base+'index.html','utf8');
          const lang=fs.readFileSync(base+'calculator-lang.js','utf8');
          assert(!html.includes('</script>\\n<script'), 'Literal backslash-n remains between scripts');
          assert(html.includes('calculator-lang.js?v=20261103-1'), 'Translation script cache version not updated');
          for (const key of [
            'this is an independent planning tool.',
            'Selecting an RDAP reduction does not determine RDAP eligibility.',
            'Separate entered facts, calculations, and future scenarios',
            '10-day earning scenario · date ladder',
            '15-day earning scenario · date ladder'
          ]) assert(lang.includes(key), 'Missing translation: '+key);
          assert(lang.includes('input.placeholder=lang==="es"'), 'FSA placeholder language toggle missing');
          for (const key of [
            'const dynamicPrefixes=',
            'key.startsWith(en)',
            'prefix[1]+key.slice(prefix[0].length)',
            'Start date entered: ',
            'FTC toward supervised release in this scenario: ',
            'Modeled FSA prerelease threshold: ',
            'Separate RDAP scenario: '
          ]) assert(lang.includes(key), 'Missing variable-text translation support: '+key);
          console.log('Static bilingual wiring checks passed; browser behavior and legal accuracy still require separate review.');
          NODE
